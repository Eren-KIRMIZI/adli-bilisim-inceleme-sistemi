[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adli-bilisim-inceleme-sistemi"
version = "1.0.0"
description = "Cevrimdisi, salt-okunur PySide6 Masaaustu Adli Bilisim (DFIR) Inceleme Platformu"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6,<6.13",
    "SQLAlchemy>=2.0,<2.1",
    "pydantic>=2.5,<3.0",
    "reportlab>=4.0,<5.0",
    "Jinja2>=3.1,<4.0",
    "matplotlib>=3.8,<4.0",
    "networkx>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<10.0",
]
